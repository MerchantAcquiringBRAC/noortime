# Build and test: compiles the app, then runs the unit tests on an iOS Simulator (no signing needed).
# Phase 6 adds a separate, optional UI smoke-test workflow.
# Phase 7 adds the signed TestFlight workflow (ios-testflight) at the bottom.
workflows:
  ios-build-and-test:
    name: NoorTime build and test
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Pick an available iPhone simulator
        script: |
          xcrun simctl list devices available | grep "iPhone" | tail -1
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Using simulator: $DEVICE_ID"
          test -n "$DEVICE_ID"
          echo "export DEVICE_ID=$DEVICE_ID" > "$CM_BUILD_DIR/device_id.sh"
      - name: Build and run unit tests
        script: |
          source "$CM_BUILD_DIR/device_id.sh"
          xcodebuild test \
            -project NoorTime.xcodeproj \
            -scheme NoorTime \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

  ios-ui-smoke-test:
    name: NoorTime UI smoke test (optional)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Pick an available iPhone simulator
        script: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Using simulator: $DEVICE_ID"
          test -n "$DEVICE_ID"
          echo "export DEVICE_ID=$DEVICE_ID" > "$CM_BUILD_DIR/device_id.sh"
      - name: Run UI smoke tests
        script: |
          source "$CM_BUILD_DIR/device_id.sh"
          xcodebuild test \
            -project NoorTime.xcodeproj \
            -scheme NoorTimeUI \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

  # Signed build that uploads to TestFlight.
  # Needs (one-time, in the Codemagic website, NOT in this file): an App Store Connect API key integration
  # named exactly  NoorTime-ASC  . See Release/GITHUB_CODEMAGIC_GUIDE.md. No secrets are stored in this repo.
  ios-testflight:
    name: NoorTime TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NoorTime-ASC
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.noortime
      vars:
        # The number shown as "Apple ID" in App Store Connect > your app > App Information. Not a secret.
        APP_STORE_APPLE_ID: "0000000000"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Set the next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up signing
        script: |
          keychain initialize
          xcode-project use-profiles
      - name: Build the signed app
        script: |
          xcode-project build-ipa \
            --project NoorTime.xcodeproj \
            --scheme NoorTime
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

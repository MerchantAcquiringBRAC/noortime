name: NoorTime

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.5.0

targets:
  NoorTime:
    type: application
    platform: iOS
    sources:
      - path: NoorTime
    dependencies:
      - package: Adhan
    info:
      path: NoorTime/Info.plist
      properties:
        CFBundleDisplayName: NoorTime
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - bn
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.noortime
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NoorTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoorTimeTests
    dependencies:
      - target: NoorTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.noortime.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NoorTime:
    build:
      targets:
        NoorTime: all
    test:
      targets:
        - NoorTimeTests
